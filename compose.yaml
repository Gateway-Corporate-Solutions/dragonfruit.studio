# Local metadata database only. Application execution/host Docker access is not wired.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dragonfruit
      POSTGRES_PASSWORD: dragonfruit
      POSTGRES_DB: dragonfruit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragonfruit -d dragonfruit"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  metadata:
