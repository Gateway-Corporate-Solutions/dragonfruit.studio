name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dragonfruit
          POSTGRES_PASSWORD: dragonfruit
          POSTGRES_DB: dragonfruit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dragonfruit -d dragonfruit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dragonfruit:dragonfruit@127.0.0.1:5432/dragonfruit_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: cp .env.example .env
      - run: deno install --frozen
      - run: deno task verify
      - run: deno task smoke
      - run: deno task test:integration
